<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Me When You're Feeling Sad</title>
  <style>
    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background-color: #f3e8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      color: #4b0082;
      flex-direction: column;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 3rem);
      margin-bottom: 20px;
    }
    button {
      background-color: #c084fc;
      color: white;
      border: none;
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #a855f7;
      transform: scale(1.05);
    }
    #quote {
      margin-top: 20px;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      max-width: 80%;
    }
    #gameArea {
      margin-top: 20px;
      width: 90%;
      height: 50vh;
      background: #e9d5ff;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: none;
    }
    .heart {
      position: absolute;
      font-size: 30px;
      pointer-events: none;
    }
    #message {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #9333ea;
    }
  </style>
</head>
<body>
  <h1>Click Me When You're Feeling Sad 💜</h1>

  <!-- Buttons -->
  <button onclick="surprise()">💌 Click Me</button>
  <button onclick="startGame()">🎮 Play Heart Catch</button>

  <div id="quote"></div>
  <div id="gameArea"></div>
  <div id="message"></div>

  <script>
    // 💌 Love Quotes
    const quotes = [
      "You make my world brighter every day 💜",
      "I love you more than words can ever say 💕",
      "You're my sunshine on the cloudiest days ☀️",
      "No matter what, I’ll always be by your side 💖",
      "You are the reason my heart smiles 🌸"
    ];

    // 🌸 Cheer-up Messages
    const cheers = [
      "Everything will be okay, you’re stronger than you think 🌈",
      "Even the darkest nights end with a sunrise ☀️",
      "You’ve got this, I believe in you 💪",
      "Take a deep breath, brighter days are coming 💕",
      "You’re never alone, I’m always here for you 💜"
    ];

    // 🎮 Game Variables
    let gameScore = 0;
    let heartInterval, timerTimeout;

    // Show either a love quote or cheer-up message
    function surprise() {
      const random = Math.random();
      if (random < 0.5) {
        showQuote();
      } else {
        showCheer();
      }
    }

    // Show a random love quote
    function showQuote() {
      document.getElementById("gameArea").style.display = "none";
      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById("quote").textContent = quotes[randomIndex];
      document.getElementById("message").textContent = "";
    }

    // Show a random cheer-up message
    function showCheer() {
      document.getElementById("gameArea").style.display = "none";
      const randomIndex = Math.floor(Math.random() * cheers.length);
      document.getElementById("quote").textContent = cheers[randomIndex];
      document.getElementById("message").textContent = "";
    }

    // 🌸 Automatic Floating Hearts
    function floatingHearts() {
      const heart = document.createElement("div");
      heart.textContent = "💜";
      heart.classList.add("heart");
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.top = window.innerHeight + "px";
      document.body.appendChild(heart);

      let rise = setInterval(() => {
        let currentTop = parseInt(heart.style.top);
        if (currentTop < -50) {
          clearInterval(rise);
          heart.remove();
        } else {
          heart.style.top = currentTop - 2 + "px";
        }
      }, 30);
    }
    setInterval(floatingHearts, 1500); // spawn hearts every 1.5s

    // 🎮 Start the 10-second heart-catching game
    function startGame() {
      const gameArea = document.getElementById("gameArea");
      const messageDiv = document.getElementById("message");
      const quoteDiv = document.getElementById("quote");
      quoteDiv.textContent = "";
      messageDiv.textContent = "Catch as many hearts as you can in 10 seconds! 💜";
      gameArea.style.display = "block";
      gameArea.innerHTML = "";
      gameScore = 0;

      heartInterval = setInterval(dropHeart, 800);
      timerTimeout = setTimeout(endGame, 10000);
    }

    function dropHeart() {
      const gameArea = document.getElementById("gameArea");
      const heart = document.createElement("div");
      heart.textContent = "💜";
      heart.style.position = "absolute";
      heart.style.left = Math.random() * (gameArea.offsetWidth - 30) + "px";
      heart.style.top = "0px";
      heart.style.fontSize = "30px";
      heart.style.cursor = "pointer";
      gameArea.appendChild(heart);

      let fall = setInterval(() => {
        let currentTop = parseInt(heart.style.top);
        if (currentTop > gameArea.offsetHeight - 40) {
          clearInterval(fall);
          heart.remove();
        } else {
          heart.style.top = currentTop + 3 + "px";
        }
      }, 30);

      heart.addEventListener("click", () => {
        gameScore++;
        clearInterval(fall);
        heart.remove();
      });
    }

    function endGame() {
      clearInterval(heartInterval);
      document.getElementById("gameArea").innerHTML = "";
      document.getElementById("message").textContent = `Time's up! You caught ${gameScore} hearts 💜❤️✨`;
    }
  </script>
</body>
</html>
